name: Validate notch masking

on:
  push:
    branches: [feat/notch-mask-ci]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact commit to build and test
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Record build environment
        run: |
          mkdir -p build/artifacts
          {
            git rev-parse HEAD
            uname -m
            sw_vers
            xcodebuild -version
          } | tee build/artifacts/BUILD-INFO.txt

      # Xcode's app-hosted test runner can fail to connect when its build
      # lives under a project-relative DerivedData path. Use its default
      # location for Debug tests; Release packaging has its own directory.
      - name: Build app, extension and test bundle
        run: |
          xcodebuild build-for-testing \
            -project Aerial.xcodeproj -scheme Aerial \
            -configuration Debug -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee build/debug-build.log | xcbeautify --disable-colored-output

      - name: Run unit tests
        timeout-minutes: 8
        run: |
          xcodebuild test-without-building \
            -project Aerial.xcodeproj -scheme Aerial \
            -configuration Debug -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            -resultBundlePath build/TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee build/test.log | xcbeautify --disable-colored-output

      - name: Export test summary and diagnostics
        if: always()
        run: |
          if [[ -d build/TestResults.xcresult ]]; then
            xcrun xcresulttool get test-results summary --path build/TestResults.xcresult \
              > build/test-summary.json || true
            xcrun xcresulttool export diagnostics --path build/TestResults.xcresult \
              --output-path build/test-diagnostics || true
          fi

      - name: Build release app
        run: |
          xcodebuild build \
            -project Aerial.xcodeproj -scheme Aerial \
            -configuration Release -destination 'platform=macOS,arch=${{ matrix.arch }}' \
            -derivedDataPath build/Release \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= ARCHS=${{ matrix.arch }} ONLY_ACTIVE_ARCH=YES \
            > build/release.log 2>&1 || { tail -n 120 build/release.log; exit 1; }
          tail -n 15 build/release.log

      - name: Verify and package personal test build
        run: |
          app=build/Release/Build/Products/Release/Aerial.app
          test -d "$app/Contents/Extensions/Aerial4WallpaperExtension.appex"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --verbose=2 "$app" 2>&1 | tee -a build/artifacts/BUILD-INFO.txt
          echo 'Ad-hoc-signed validation build. Not notarized. Hardware coverage is reported separately in the PR.' \
            >> build/artifacts/BUILD-INFO.txt
          ditto -c -k --sequesterRsrc --keepParent "$app" build/artifacts/Aerial-notch-${{ matrix.arch }}.zip
          cd build/artifacts
          shasum -a 256 Aerial-notch-${{ matrix.arch }}.zip > SHA256SUMS.txt

      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Aerial-notch-${{ matrix.arch }}
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macOS-build-diagnostics-${{ matrix.arch }}
          path: |
            build/*.log
            build/TestResults.xcresult
            build/test-summary.json
            build/test-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
