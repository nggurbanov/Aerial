name: Build macOS notch edition

on:
  push:
    branches: [feat/hide-notch]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Record build environment
        run: |
          mkdir -p build/artifacts
          {
            echo "Commit: $GITHUB_SHA"
            uname -m
            sw_vers
            xcodebuild -version
          } | tee build/artifacts/BUILD-INFO.txt

      # Xcode's app-hosted test runner can fail to connect when its build
      # lives under a project-relative DerivedData path. Use its default
      # location for Debug tests; Release packaging has its own directory.
      - name: Build app, extension and test bundle
        run: |
          xcodebuild build-for-testing \
            -project Aerial.xcodeproj -scheme Aerial \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee build/debug-build.log | xcbeautify --disable-colored-output

      - name: Run unit tests
        timeout-minutes: 8
        run: |
          xcodebuild test-without-building \
            -project Aerial.xcodeproj -scheme Aerial \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -resultBundlePath build/TestResults.xcresult \
            -parallel-testing-enabled NO \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            2>&1 | tee build/test.log | xcbeautify --disable-colored-output

      - name: Build release app
        run: |
          xcodebuild build \
            -project Aerial.xcodeproj -scheme Aerial \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/Release \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            > build/release.log 2>&1 || { tail -n 120 build/release.log; exit 1; }
          tail -n 15 build/release.log

      - name: Verify and package personal test build
        run: |
          app=build/Release/Build/Products/Release/Aerial.app
          test -d "$app/Contents/PlugIns/Aerial4WallpaperExtension.appex"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --verbose=2 "$app" 2>&1 | tee -a build/artifacts/BUILD-INFO.txt
          echo 'Personal ad-hoc-signed build. Not notarized. On-device notch verification pending.' \
            >> build/artifacts/BUILD-INFO.txt
          ditto -c -k --sequesterRsrc --keepParent "$app" build/artifacts/Aerial-notch-arm64.zip
          cd build/artifacts
          shasum -a 256 Aerial-notch-arm64.zip > SHA256SUMS.txt

      - name: Upload app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Aerial-notch-arm64
          path: build/artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macOS-build-diagnostics
          path: |
            build/*.log
            build/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
